<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Memory Pairs 🧠</title>
  <meta name="theme-color" content="#AEDFF7" />
  <link rel="stylesheet" href="../../css/theme.css" />
  <style>
    .mem-board {
      display: grid;
      gap: clamp(8px, 2vw, 14px);
      width: min(92vw, 520px);
      margin: 18px auto;
    }
    .mem-card {
      aspect-ratio: 1;
      perspective: 600px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mem-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .4s cubic-bezier(.2,1.2,.4,1);
    }
    .mem-card.flipped .mem-inner,
    .mem-card.matched .mem-inner { transform: rotateY(180deg); }
    .mem-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      user-select: none;
    }
    .mem-back {
      background: linear-gradient(135deg, var(--blue), var(--pink));
      font-size: clamp(1.4rem, 1rem + 4vw, 2.2rem);
    }
    .mem-front {
      background: #fff;
      border: 3px solid var(--lilac);
      transform: rotateY(180deg);
      font-size: clamp(1.8rem, 1rem + 7vw, 3.4rem);
    }
    .mem-card.matched .mem-front {
      border-color: var(--good);
      animation: pop .4s ease;
    }
    .stat-row {
      display: flex;
      gap: 18px;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="game-main">
    <h1 class="game-title title-gradient">Memory Pairs 🧠</h1>
    <p class="subtle">Flip two cards and find the matching pairs!</p>

    <div class="chip-row" id="level-row">
      <button class="chip active" data-pairs="6">Easy · 6 pairs</button>
      <button class="chip" data-pairs="8">Medium · 8 pairs</button>
      <button class="chip" data-pairs="10">Hard · 10 pairs</button>
    </div>

    <div class="stat-row">
      <span>🔄 Moves: <strong id="moves">0</strong></span>
      <span>⏱️ Time: <strong id="time">0s</strong></span>
    </div>

    <div class="mem-board" id="board"></div>

    <button class="btn btn-primary btn-lg" id="restart">🔄 New Game</button>
  </main>

  <script type="module" src="memory.js"></script>
</body>
</html>
