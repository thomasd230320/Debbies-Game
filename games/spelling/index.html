<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spelling Bee 🐝</title>
  <meta name="theme-color" content="#AEDFF7" />
  <link rel="stylesheet" href="../../css/theme.css" />
  <style>
    .panel { max-width: 520px; margin: 0 auto; }
    .speaker-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 4px solid var(--blue);
      padding: 26px 16px;
      margin: 18px auto;
    }
    .bee { font-size: clamp(3rem, 2rem + 8vw, 5rem); }
    .word-reveal {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 1rem + 6vw, 3rem);
      letter-spacing: .12em;
      min-height: 1.4em;
      color: var(--ink);
    }
    .spell-input {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.6rem, 1rem + 4vw, 2.4rem);
      text-align: center;
      letter-spacing: .1em;
      width: min(90vw, 420px);
      padding: 14px;
      border: 4px solid var(--lilac);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      outline: none;
      margin: 8px auto;
      display: block;
    }
    .spell-input:focus { border-color: var(--pink-deep); }
    .letters { font-family: 'Poppins', sans-serif; font-size: 1.6rem; letter-spacing: .14em; min-height: 1.4em; margin: 6px 0; }
    .letters .ok { color: var(--good-deep); }
    .letters .no { color: var(--bad-deep); text-decoration: underline; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
    .hud { font-family: 'Poppins', sans-serif; font-size: 1.2rem; }
    .hint-text { color: var(--pink-deep); font-weight: 600; min-height: 1.4em; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="game-main">
    <h1 class="game-title title-gradient">Spelling Bee 🐝</h1>

    <div id="setup" class="panel">
      <p class="subtle">Listen to the word, then type how you think it is spelled!</p>
      <div class="chip-row" id="level-row">
        <button class="chip active" data-level="easy">⭐ Easy</button>
        <button class="chip" data-level="medium">⭐⭐ Medium</button>
        <button class="chip" data-level="hard">⭐⭐⭐ Hard</button>
      </div>
      <button class="btn btn-primary btn-lg" id="start-btn">🚀 Start spelling!</button>
      <p class="subtle" id="speech-warn" style="margin-top:12px" hidden>
        🔇 Your device can’t speak the words, so they’ll be shown on screen instead.
      </p>
    </div>

    <div id="play" class="panel" hidden>
      <div class="hud">🐝 Word <strong id="num">1</strong> · 🎯 <strong id="score">0</strong></div>
      <div class="speaker-card">
        <div class="bee floaty">🐝</div>
        <div class="word-reveal" id="word-reveal"></div>
        <div class="hint-text" id="hint"></div>
        <div class="btn-row">
          <button class="btn btn-blue" id="say-btn">🔊 Say it</button>
          <button class="btn btn-pink" id="hint-btn">💡 Hint</button>
        </div>
      </div>

      <input class="spell-input" id="spell-input" type="text"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" placeholder="type here" />
      <div class="letters" id="letters"></div>

      <div class="btn-row">
        <button class="btn btn-primary btn-lg" id="check-btn">✅ Check</button>
        <button class="btn" id="skip-btn">⏭️ Skip</button>
      </div>
    </div>
  </main>

  <script type="module" src="spelling.js"></script>
</body>
</html>
