<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Star Shop 🛍️</title>
  <meta name="theme-color" content="#FFD1E8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="topbar"></div>
  <main class="game-main">
    <h1 class="game-title title-gradient">Star Shop 🛍️</h1>
    <p class="subtle">Adopt a pet, dress it up and feed it with your ⭐ stars!</p>

    <div class="chip-row" id="tabs">
      <button class="chip active" data-tab="pet">🐾 My Pet</button>
      <button class="chip" data-tab="adopt">🏡 Adopt</button>
      <button class="chip" data-tab="dress">👑 Dress Up</button>
      <button class="chip" data-tab="theme">🎨 Themes</button>
    </div>

    <!-- My Pet -->
    <section id="tab-pet" class="tab-panel">
      <div id="pet-display"></div>
      <div class="pet-name-row">
        <span id="pet-name" class="pet-name"></span>
        <button class="icon-btn" id="rename-btn" aria-label="Rename pet">✏️</button>
      </div>

      <div class="happy-wrap">
        <span>😊 Happiness</span>
        <div class="happy-bar"><div class="happy-fill" id="happy-fill"></div></div>
      </div>
      <button class="btn btn-primary btn-lg" id="feed-btn">🍎 Feed (3 ⭐)</button>
      <p class="subtle" id="pet-hint"></p>
    </section>

    <!-- Adopt -->
    <section id="tab-adopt" class="tab-panel" hidden>
      <p class="subtle">Tap to adopt a new friend. You can switch between pets you own any time!</p>
      <div class="shop-grid" id="adopt-grid"></div>
    </section>

    <!-- Dress Up -->
    <section id="tab-dress" class="tab-panel" hidden>
      <p class="subtle">Buy accessories, then tap to put them on (or take them off) your pet.</p>
      <div id="mini-pet"></div>
      <div id="dress-groups"></div>
    </section>

    <!-- Themes -->
    <section id="tab-theme" class="tab-panel" hidden>
      <p class="subtle">Buy a colour theme to change how the whole app looks!</p>
      <div class="shop-grid" id="theme-grid"></div>
    </section>
  </main>

  <script type="module" src="pet.js"></script>
</body>
</html>
